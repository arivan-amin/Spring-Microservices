spring.application.name = catalog-service
spring.application.version = @project.version@
server.port = 17001

# ===================================
# BANNER PROPERTIES
# ===================================
project-name = @project.parent.artifactId@
service-name = @project.artifactId@
service-version = @project.version@

# ===================================
# EUREKA
# ===================================
eureka.client.serviceUrl.defaultZone = http://${EUREKA_USERNAME:admin}:${EUREKA_PASSWORD:admin}@${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka
eureka.client.registry-fetch-interval-seconds = 5
eureka.instance.lease-renewal-interval-in-seconds = 10
eureka.instance.lease-expiration-duration-in-seconds = 30

# ===================================
# OPEN API SERVER URL
# ===================================
cinemayan.openapi.server.url = ${OPEN_API_SERVER_URL:http://localhost:8080}

# ===================================
# OBSERVABILITY
# ===================================
info.app.name = Catalog Service
info.app.description = Catalog Service
info.app.version = 1.0
management.observations.key-values.application = ${spring.application.name}
management.endpoints.web.exposure.include = *
management.tracing.sampling.probability = 1.0
management.info.build.enabled = true
management.info.git.enabled = true
management.info.env.enabled = true
management.endpoint.health.show-details = always
management.metrics.distribution.percentiles-histogram.http.server.requests = true
server.tomcat.mbeanregistry.enabled = true
management.endpoint.health.probes.enabled = true
management.opentelemetry.tracing.export.otlp.endpoint = http://${OPEN_TELEMETRY_HOST:localhost}:4318/v1/traces
management.otlp.metrics.export.url = http://${OPEN_TELEMETRY_HOST:localhost}:4318/v1/metrics

# ===================================
# AUDIT EVENT SENSITIVE FIELDS
# ===================================
audit.masking.sensitive.fields[0] = password
audit.masking.sensitive.fields[1] = pin
audit.masking.sensitive.fields[2] = cvv
audit.masking.sensitive.fields[3] = cardNumber
audit.masking.sensitive.fields[4] = ssn
audit.masking.sensitive.fields[5] = secretKey
audit.masking.sensitive.fields[6] = token

# ===================================
# ACTUATOR
# ===================================
management.endpoints.web.base-path = /actuator/catalog

# ===================================
# MYSQL
# ===================================
spring.datasource.url = jdbc:mysql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:41301}/${CATALOG_DB_NAME:catalog_db}
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto = validate
spring.datasource.username = ${CATALOG_DB_USERNAME:catalog_user}
spring.datasource.password = ${CATALOG_DB_PASSWORD:catalog@@pass}
spring.jpa.open-in-view = false

# ===================================
# LIQUIBASE DATABASE USER PROPERTIES
# ===================================
cinemayan.catalog.liquibase.url = jdbc:mysql://${CATALOG_DB_HOST:localhost}:${CATALOG_DB_PORT:41301}/${CATALOG_DB_NAME:catalog_db}
cinemayan.catalog.liquibase.username = ${CATALOG_LIQUIBASE_USERNAME:catalog_migration}
cinemayan.catalog.liquibase.password = ${CATALOG_LIQUIBASE_PASSWORD:catalog@@cmy}

# ===================================
# HIKARI CONNECTION POOL SETTINGS
# ===================================
spring.datasource.hikari.minimum-idle = 5
spring.datasource.hikari.maximum-pool-size = 10
spring.datasource.hikari.max-lifetime = 1800000
spring.datasource.hikari.connection-timeout = 30000
spring.datasource.hikari.idle-timeout = 300000
spring.datasource.hikari.leak-detection-threshold = 15000
spring.datasource.hikari.pool-name = HikariCP-LocalProd
spring.datasource.hikari.validation-timeout = 5000

# ===================================
# CACHE
# ===================================
spring.cache.type = caffeine
spring.cache.caffeine.spec = maximumSize=100,expireAfterAccess=10s

# ===================================
# KAFKA
# ===================================
spring.kafka.producer.bootstrap-servers = ${KAFKA_BROKER_SERVER:localhost}:${KAFKA_BROKER_PORT:9092}
spring.kafka.producer.key-serializer = org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer = org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.metadata.max.age.ms = 1000
spring.kafka.producer.metadata.max.idle.ms = 5000
spring.kafka.producer.max-block-ms = 1000
spring.kafka.producer.delivery-timeout-ms = 1000
spring.kafka.producer.request-timeout-ms = 1000
spring.kafka.producer.retries = 0
spring.kafka.properties.reconnect.backoff.ms = 5000
spring.kafka.properties.reconnect.backoff.max.ms = 5000

# ===================================
# SCHEDULER
# ===================================
scheduler.cronjob = ${SPRING_SCHEDULER_CRONJOB:0 0/10 * ? * *}
